[workspace]
resolver = "3"
members = [
    "crates/slopgene-core",
    "crates/slopgene-script",
    "crates/slopgene-cli",
    "crates/slopgene-gui",
    "crates/slopgene-update",
]

[workspace.package]
version = "0.3.0"
authors = ["Claude", "Debraj Ghose"]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DebrajGhose/slopgene"
publish = false

[workspace.dependencies]
slopgene-core = { path = "crates/slopgene-core" }
slopgene-script = { path = "crates/slopgene-script" }
slopgene-update = { path = "crates/slopgene-update" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
lzma-rs = "0.3"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
rhai = { version = "1.26", features = ["serde", "sync", "metadata"] }
rayon = "1.12"
globset = "0.4"
walkdir = "2.5"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
    "accesskit",
    "persistence",
] }
rfd = "0.17"
resvg = "0.48"
# Writes the app's recordings (slopgene-gui --record). Its own colour quantizer is left out.
gif = { version = "0.14", default-features = false, features = ["std"] }
# Reads releases from GitHub and downloads them (slopgene-update), over TLS with rustls.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
sha2 = "0.10"

[profile.dev]
# Full debug info makes the GUI binary ~350 MB; line tables keep backtraces readable.
debug = "line-tables-only"

[profile.dev.package."*"]
# egui, wgpu and rhai are slow when unoptimised; optimise dependencies even in dev builds.
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
